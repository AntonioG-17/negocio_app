name: negocio_app
description: "Dashboard e inventario profesional para negocios fisicos."
publish_to: 'none'

version: 1.5.1+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Barcode scanner
  mobile_scanner: ^7.0.0

  # Local storage (offline cache)
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.71.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Export & share
  excel: ^4.0.6
  share_plus: ^10.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
