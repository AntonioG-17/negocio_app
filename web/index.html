<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NegocioApp">

  <!-- viewport-fit=cover expone los safe-area insets (barra de inicio del iPhone,
       notch) a Flutter, para que la barra de menú inferior no quede cortada. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NegocioApp">
  <meta name="theme-color" content="#0F1117">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NegocioApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pantalla de inicio: aparece al instante (HTML puro) y se quita sola cuando
       Flutter ya pintó. Evita el "blanco" mientras carga el motor gráfico. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0F1117; }
    #app-splash {
      position: fixed; inset: 0; z-index: 99999; background: #0F1117;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: opacity 0.35s ease; opacity: 1;
    }
    #app-splash .logo {
      width: 156px; height: 156px; border-radius: 36px;
      background: rgba(0, 200, 150, 0.14);
      display: flex; align-items: center; justify-content: center; margin-bottom: 28px;
    }
    #app-splash .logo svg { width: 92px; height: 92px; }
    #app-splash .title { color: #E8E8F0; font-size: 28px; font-weight: 700; letter-spacing: 0.3px; }
    #app-splash .sub { color: #8B8FA8; font-size: 14px; margin-top: 8px; }
    #app-splash .spinner {
      margin-top: 30px; width: 30px; height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: #00C896;
      border-radius: 50%; animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>

  <!--
    Auto-update + barcode scanner loader.
    Goal: the user NEVER has to refresh or clear anything. Every deploy ships a
    new serviceWorkerVersion; we detect it, wipe stale caches, and load all
    scripts with ?v=<version> so even files marked `immutable` are re-fetched.
  -->
  <script>
    // Watchdog de auto-recuperación: si Flutter no renderiza en ~12s (caché
    // corrupto/atascado), limpia TODO y recarga una sola vez para auto-sanar.
    (function () {
      function flutterBooted() {
        return !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas');
      }

      // Quitar la pantalla de inicio cuando Flutter pinta. Se deja ~700ms extra
      // para que el dashboard alcance a dibujar su primer frame y no se vea el
      // "tirón" inicial bajo el splash.
      var splashPoll = setInterval(function () {
        if (!flutterBooted()) return;
        clearInterval(splashPoll);
        setTimeout(function () {
          var sp = document.getElementById('app-splash');
          if (sp) {
            sp.style.opacity = '0';
            setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 400);
          }
        }, 700);
      }, 120);

      // Watchdog: si Flutter no renderiza en ~12s (caché corrupto/atascado),
      // limpia TODO y recarga una sola vez para auto-sanar.
      setTimeout(async function () {
        if (flutterBooted()) return;
        if (sessionStorage.getItem('_watchdog_reloaded') === '1') return;
        sessionStorage.setItem('_watchdog_reloaded', '1');
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {}
        location.reload();
      }, 12000);
    })();

    (async function () {
      function loadScript(src) {
        return new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = resolve;
          document.head.appendChild(s);
        });
      }

      let version = String(Date.now());
      try {
        // Always pull flutter_bootstrap.js straight from the network (unique URL
        // bypasses both the service worker and the HTTP cache). Abort after 2.5s
        // so a slow/flaky network can't hang the app start — we fall back to the
        // cached app below.
        const ctrl = new AbortController();
        const to = setTimeout(function () { ctrl.abort(); }, 2500);
        const resp = await fetch('/flutter_bootstrap.js?_=' + Date.now(),
          { cache: 'no-store', signal: ctrl.signal });
        const text = await resp.text();
        clearTimeout(to);

        const match = text.match(/serviceWorkerVersion:\s*"(\d+)"/);
        version = match ? match[1] : version;

        const storedVersion = localStorage.getItem('_app_version');

        // App actualizada → limpiar caches + service worker y CONTINUAR cargando
        // la versión nueva en ESTA misma sesión (sin recargar). Antes se hacía
        // location.reload(), lo que mostraba el splash dos veces (doble-arranque).
        // El bootstrap y los scripts se piden con ?v=version fresco, así que la
        // app queda actualizada igual; el shell (index.html) se refresca solo en
        // la próxima apertura gracias a la limpieza de caches/SW.
        if (storedVersion && storedVersion !== version) {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
        }
        localStorage.setItem('_app_version', version);

        // Barcode scanner: Quagga2 (143KB) loads in the BACKGROUND — it's only
        // needed when the user opens the scanner, so it must not delay app start.
        // The tiny bridge is awaited since Dart calls its functions.
        loadScript('quagga.min.js?v=' + version);
        await loadScript('scanner_bridge.js?v=' + version);

        // Patch main.dart.js with the version and run the bootstrap as a blob.
        const patched = text
          .replace('"main.dart.js"', '"main.dart.js?v=' + version + '"')
          .replace("'main.dart.js'", "'main.dart.js?v=" + version + "'")
          .replace(/"mainJsPath":"main\.dart\.js"/, '"mainJsPath":"main.dart.js?v=' + version + '"');

        const blob = new Blob([patched], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => URL.revokeObjectURL(url);
        document.head.appendChild(s);

      } catch (e) {
        console.warn('Version check failed, loading normally:', e);
        await loadScript('quagga.min.js?v=' + version);
        await loadScript('scanner_bridge.js?v=' + version);
        const s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
  <div id="app-splash">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="92" height="92"
           viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1.5-5h15L21 9" />
        <path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9" />
        <path d="M9 21v-6h6v6" />
      </svg>
    </div>
    <div class="title">NegocioApp</div>
    <div class="sub">Cargando…</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
