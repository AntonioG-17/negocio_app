<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NegocioApp">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NegocioApp">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <meta name="theme-color" content="#0F1117">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NegocioApp</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0F1117; }
    #app-splash {
      position: fixed; inset: 0; z-index: 99999; background: #0F1117;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: opacity 0.35s ease; opacity: 1;
    }
    #app-splash .logo {
      width: 156px; height: 156px; border-radius: 36px;
      background: rgba(79, 127, 250, 0.14);
      display: flex; align-items: center; justify-content: center; margin-bottom: 28px;
    }
    #app-splash .logo svg { width: 92px; height: 92px; }
    #app-splash .title { color: #E8E8F0; font-size: 28px; font-weight: 700; letter-spacing: 0.3px; }
    #app-splash .sub { color: #8B8FA8; font-size: 14px; margin-top: 8px; }
    #app-splash .spinner {
      margin-top: 30px; width: 30px; height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: #4F7FFA;
      border-radius: 50%; animation: splash-spin 0.8s linear infinite;
    }
    #app-splash .slow-hint {
      margin-top: 20px; font-size: 12px; color: #555870;
      display: none; text-align: center; padding: 0 40px;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    (function () {
      function flutterBooted() {
        return !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas');
      }

      // Mostrar hint de "conexión lenta" si tarda más de 8s — el usuario sabe
      // que está cargando, no que se colgó.
      setTimeout(function () {
        if (flutterBooted()) return;
        var hint = document.getElementById('slow-hint');
        if (hint) hint.style.display = 'block';
      }, 8000);

      // Quitar splash cuando Flutter pinta.
      var splashPoll = setInterval(function () {
        if (!flutterBooted()) return;
        clearInterval(splashPoll);
        setTimeout(function () {
          var sp = document.getElementById('app-splash');
          if (sp) {
            sp.style.opacity = '0';
            setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 400);
          }
        }, 700);
      }, 120);

      // Watchdog: 45s (era 12s).
      // canvaskit.wasm pesa 6.9MB — en 3G/datos lentos tarda 15-25s.
      // Con 12s el watchdog disparaba antes de que terminara, limpiaba el
      // caché y reiniciaba → loop infinito. 45s da margen real para redes lentas.
      setTimeout(async function () {
        if (flutterBooted()) return;
        if (sessionStorage.getItem('_watchdog_reloaded') === '1') return;
        sessionStorage.setItem('_watchdog_reloaded', '1');
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {}
        location.reload();
      }, 45000);
    })();

    (async function () {
      function loadScript(src) {
        return new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = resolve;
          document.head.appendChild(s);
        });
      }

      // Detectar conexión lenta para ajustar el timeout de version-check.
      // Navigator.connection es una API experimental pero disponible en Chrome/Android.
      // En Safari/iOS no existe — usamos el timeout largo de todas formas.
      var isSlowConnection = false;
      try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
          isSlowConnection = conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g' ||
                             conn.saveData === true;
        }
      } catch (e) {}

      // Timeout del version-check: 8s en conexión normal, 15s en conexión lenta.
      // Antes era 2.5s — demasiado corto para datos móviles lentos, hacía que
      // siempre cargara la versión vieja del caché.
      var versionCheckTimeout = isSlowConnection ? 15000 : 8000;

      let version = String(Date.now());
      try {
        const ctrl = new AbortController();
        const to = setTimeout(function () { ctrl.abort(); }, versionCheckTimeout);
        const resp = await fetch('/flutter_bootstrap.js?_=' + Date.now(),
          { cache: 'no-store', signal: ctrl.signal });
        const text = await resp.text();
        clearTimeout(to);

        const match = text.match(/serviceWorkerVersion:\s*"(\d+)"/);
        version = match ? match[1] : version;
        window._appVersion = version;

        const storedVersion = localStorage.getItem('_app_version');

        if (storedVersion && storedVersion !== version) {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
        }
        localStorage.setItem('_app_version', version);

        loadScript('quagga.min.js?v=' + version);
        await loadScript('scanner_bridge.js?v=' + version);

        const patched = text
          .replace('"main.dart.js"', '"main.dart.js?v=' + version + '"')
          .replace("'main.dart.js'", "'main.dart.js?v=" + version + "'")
          .replace(/"mainJsPath":"main\.dart\.js"/, '"mainJsPath":"main.dart.js?v=' + version + '"');

        const blob = new Blob([patched], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => URL.revokeObjectURL(url);
        document.head.appendChild(s);

      } catch (e) {
        // Sin red o timeout: cargar desde caché (funciona offline).
        console.warn('Version check failed, loading from cache:', e.message || e);
        window._appVersion = version;
        loadScript('quagga.min.js?v=' + version);
        await loadScript('scanner_bridge.js?v=' + version);
        const s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
  <div id="app-splash">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="92" height="92"
           viewBox="0 0 24 24" fill="none" stroke="#4F7FFA" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1.5-5h15L21 9" />
        <path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9" />
        <path d="M9 21v-6h6v6" />
      </svg>
    </div>
    <div class="title">NegocioApp</div>
    <div class="sub">Cargando…</div>
    <div class="spinner"></div>
    <div id="slow-hint" class="slow-hint">
      Conexión lenta detectada.<br>Cargando desde el caché…
    </div>
  </div>
</body>
</html>
