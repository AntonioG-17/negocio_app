<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NegocioApp">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NegocioApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NegocioApp</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Auto-update + barcode scanner loader.
    Goal: the user NEVER has to refresh or clear anything. Every deploy ships a
    new serviceWorkerVersion; we detect it, wipe stale caches, and load all
    scripts with ?v=<version> so even files marked `immutable` are re-fetched.
  -->
  <script>
    // Watchdog de auto-recuperación: si Flutter no renderiza en ~12s (caché
    // corrupto/atascado), limpia TODO y recarga una sola vez para auto-sanar.
    (function () {
      function flutterBooted() {
        return !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas');
      }
      setTimeout(async function () {
        if (flutterBooted()) return;
        if (sessionStorage.getItem('_watchdog_reloaded') === '1') return;
        sessionStorage.setItem('_watchdog_reloaded', '1');
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {}
        location.reload();
      }, 12000);
    })();

    (async function () {
      function loadScript(src) {
        return new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = resolve;
          document.head.appendChild(s);
        });
      }

      let version = String(Date.now());
      try {
        // Always pull flutter_bootstrap.js straight from the network (unique URL
        // bypasses both the service worker and the HTTP cache). Abort after 2.5s
        // so a slow/flaky network can't hang the app start — we fall back to the
        // cached app below.
        const ctrl = new AbortController();
        const to = setTimeout(function () { ctrl.abort(); }, 2500);
        const resp = await fetch('/flutter_bootstrap.js?_=' + Date.now(),
          { cache: 'no-store', signal: ctrl.signal });
        const text = await resp.text();
        clearTimeout(to);

        const match = text.match(/serviceWorkerVersion:\s*"(\d+)"/);
        version = match ? match[1] : version;

        const storedVersion = localStorage.getItem('_app_version');

        // App was updated → nuke every cache + the service worker, then reload
        // ONCE so this session already runs the fresh index.html and assets.
        // Fully automatic: no manual refresh, no remove/re-add.
        if (storedVersion && storedVersion !== version) {
          localStorage.setItem('_app_version', version);
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
          if (sessionStorage.getItem('_reloaded_for') !== version) {
            sessionStorage.setItem('_reloaded_for', version);
            location.reload();
            return; // stop here — the reload picks up everything fresh
          }
        }
        localStorage.setItem('_app_version', version);

        // Barcode scanner: Quagga2 (143KB) loads in the BACKGROUND — it's only
        // needed when the user opens the scanner, so it must not delay app start.
        // The tiny bridge is awaited since Dart calls its functions.
        loadScript('quagga.min.js?v=' + version);
        await loadScript('scanner_bridge.js?v=' + version);

        // Patch main.dart.js with the version and run the bootstrap as a blob.
        const patched = text
          .replace('"main.dart.js"', '"main.dart.js?v=' + version + '"')
          .replace("'main.dart.js'", "'main.dart.js?v=" + version + "'")
          .replace(/"mainJsPath":"main\.dart\.js"/, '"mainJsPath":"main.dart.js?v=' + version + '"');

        const blob = new Blob([patched], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => URL.revokeObjectURL(url);
        document.head.appendChild(s);

      } catch (e) {
        console.warn('Version check failed, loading normally:', e);
        await loadScript('quagga.min.js?v=' + version);
        await loadScript('scanner_bridge.js?v=' + version);
        const s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
</body>
</html>
