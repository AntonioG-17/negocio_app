<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NegocioApp">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NegocioApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NegocioApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- ZXing barcode library — hosted locally so mobile_scanner works offline/PWA on Safari -->
  <script id="mobile-scanner-barcode-reader" src="zxing.js"></script>

  <script>
    (async function () {
      try {
        // Siempre trae flutter_bootstrap.js directo de la red (nunca del caché HTTP)
        const resp = await fetch('/flutter_bootstrap.js?_=' + Date.now(), { cache: 'no-store' });
        const text = await resp.text();

        // Extrae la versión del service worker embebida en el bootstrap
        const match = text.match(/serviceWorkerVersion:\s*"(\d+)"/);
        const version = match ? match[1] : String(Date.now());

        // Guarda la versión y limpia caché si cambió
        const storedVersion = localStorage.getItem('_app_version');
        localStorage.setItem('_app_version', version);

        if (storedVersion !== null && storedVersion !== version) {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
        }

        // Parcha main.dart.js para incluir la versión en la URL
        // → el browser lo trata como URL nueva y lo descarga de la red
        const patched = text
          .replace('"main.dart.js"', '"main.dart.js?v=' + version + '"')
          .replace("'main.dart.js'", "'main.dart.js?v=" + version + "'")
          .replace(/"mainJsPath":"main\.dart\.js"/, '"mainJsPath":"main.dart.js?v=' + version + '"');

        // Ejecuta el bootstrap parcheado como blob (100% bypass del caché HTTP)
        const blob = new Blob([patched], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => URL.revokeObjectURL(url);
        document.head.appendChild(s);

      } catch (e) {
        console.warn('Version check failed, loading normally:', e);
        const s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
</body>
</html>
